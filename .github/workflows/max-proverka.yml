# Проверка бота MAX: находит ваш ID в MAX и присылает тестовое сообщение.
# Запуск: вкладка Actions → «Проверка бота MAX» → Run workflow,
# затем в течение 3 минут напишите боту в MAX любое сообщение.
# Нужен секрет MAX_BOT_TOKEN (Settings → Secrets and variables → Actions).
name: Проверка бота MAX

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Найти ID и отправить тест
        env:
          TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
        run: |
          set -e
          if [ -z "$TOKEN" ]; then echo "::error::Нет секрета MAX_BOT_TOKEN"; exit 1; fi
          API=https://platform-api2.max.ru
          # Серверы MAX используют сертификат Минцифры
          curl -sSL -o ru-ca.pem https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt
          cat /etc/ssl/certs/ca-certificates.crt ru-ca.pem > ca.pem
          c() { curl -sS --cacert ca.pem -H "Authorization: $TOKEN" "$@"; }
          echo "== Бот:"; c "$API/me" | jq -c '{user_id, name, username}'
          echo "== Подписки (вебхуки):"; c "$API/subscriptions" | jq -c '.'
          ID=""; MARKER=""
          for i in 1 2 3 4 5 6; do
            echo "== Жду сообщение боту… (попытка $i из 6, до 30 сек)"
            UPD=$(c "$API/updates?limit=100&timeout=30${MARKER:+&marker=$MARKER}")
            echo "$UPD" | jq -c '.updates[]? | {update_type, sender: (.message.sender.user_id // .user.user_id // null)}'
            MARKER=$(echo "$UPD" | jq -r '.marker // empty')
            ID=$(echo "$UPD" | jq -r '[.updates[]? | (.message.sender.user_id // .user.user_id // empty)] | last // empty')
            [ -n "$ID" ] && break
          done
          if [ -z "$ID" ]; then
            echo "::error::За 3 минуты бот не получил ни одного сообщения."
            exit 1
          fi
          echo "== Ваш ID в MAX: $ID"
          c -X POST "$API/messages?user_id=$ID" -H "Content-Type: application/json" \
            -d '{"text":"✅ Юстика: проверка связи. Сюда будут приходить заявки с сайта yustika.ru."}' | jq -c '{sent: (.message != null), error: .message?.code?}'

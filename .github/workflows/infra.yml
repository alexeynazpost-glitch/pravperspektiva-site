# Настройка Яндекс Облака по шагам (запускается вручную).
name: Настройка Облака

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Шаг: check, bucket'
        required: true
        default: check

env:
  # Не секреты: идентификаторы облака и каталога
  YC_CLOUD_ID: b1gkcnj2ai241vvj5pb0
  YC_FOLDER_ID: b1grgu978ckarj17arma

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"
      - name: Войти сервисным аккаунтом
        env:
          SA_KEY: ${{ secrets.YC_SA_KEY_JSON }}
        run: |
          printf '%s' "$SA_KEY" > key.json
          yc config profile create deploy >/dev/null
          yc config set service-account-key key.json >/dev/null
          rm key.json
          yc config set cloud-id "$YC_CLOUD_ID" >/dev/null
          yc config set folder-id "$YC_FOLDER_ID" >/dev/null
      - name: Выполнить шаг
        run: bash infra/run.sh "${{ inputs.step }}"
